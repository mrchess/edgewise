name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.CERT_P12 != '' && secrets.DEVELOPER_ID != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.tag }}"
            TAG="${TAG#v}"
          fi
          VERSION=$(grep -o '"[0-9]\+\.[0-9]\+\.[0-9]\+"' \
            Sources/EdgewiseCore/Support/Version.swift | tr -d '"')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match Version.swift ($VERSION)"
            exit 1
          fi

      - name: Test before shipping
        run: swift test

      # Signing and notarization run only when the secrets exist, so a fork can
      # still cut an unsigned build without any configuration.
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/cert.p12

      - name: Store notarization credentials
        if: env.HAS_NOTARY == 'true'
        run: |
          xcrun notarytool store-credentials edgewise-notary \
            --apple-id "${{ secrets.NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.NOTARY_TEAM_ID }}" \
            --password "${{ secrets.NOTARY_PASSWORD }}"

      - name: Build release
        env:
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          NOTARY_PROFILE: ${{ env.HAS_NOTARY == 'true' && 'edgewise-notary' || '' }}
        run: ./Scripts/build-app.sh

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Matched with index() rather than a built regex: the version contains dots,
          # and escaping it into a pattern is how the previous attempt ended up with a
          # syntax error that only surfaced at tag time.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 || index($0, "## " v) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "No CHANGELOG entry for $VERSION — see CHANGELOG.md." > /tmp/notes.md
          fi
          echo "--- release notes ---"
          cat /tmp/notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          body_path: /tmp/notes.md
          draft: false
          generate_release_notes: true
